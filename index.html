<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio de Angel Poot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    /* Estilos extras específicos para la integración de la calculadora */
    .calculator-container {
      background-image: url('img1.png');
      background-size: cover;
      background-position: center;
      padding: 20px;
      border-radius: 10px;
      color: blue;
      font-family: 'System', sans-serif;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .calc-title { font-size: 50px; font-weight: bold; background-color: white; padding: 5px 15px; margin-top: 50px;}
    .calc-desc { font-size: 20px; font-weight: bold; background-color: white; padding: 5px; text-align: center; margin-top: 10px;}
    
    .calc-btn-large {
      background-color: white; color: blue; font-family: "Arial", sans-serif; font-size: 25px; font-weight: bold;
      border: none; padding: 15px 40px; cursor: pointer; border-radius: 5px; margin-top: 50px; transition: 0.3s;
    }
    .calc-btn-large:hover { background-color: #f0f0f0; }

    .calc-btn-nav {
      background-color: white; color: blue; font-family: "Arial", sans-serif; font-size: 14px; font-weight: bold;
      border: none; padding: 10px 15px; cursor: pointer; border-radius: 3px; position: absolute; bottom: 20px; left: 20px;
    }

    .calc-btn-action {
      background-color: white; color: blue; font-family: "Arial", sans-serif; font-size: 14px; font-weight: bold;
      border: none; padding: 10px 20px; cursor: pointer; border-radius: 3px; margin-top: 20px;
    }

    .calc-subpage { display: none; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .calc-subpage.active-sub { display: flex; }

    .calc-input-group { margin: 15px 0; text-align: center; }
    .calc-label { background-color: white; font-weight: bold; font-size: 20px; padding: 2px 5px; display: inline-block; margin-bottom: 5px;}
    .calc-entry { 
      background-color: black; color: white; font-family: "Arial", sans-serif; font-size: 20px;
      border: none; padding: 5px; width: 200px; text-align: right; border-radius: 3px;
    }

    .balancin-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; width: 90%;}
    .balancin-col { display: flex; flex-direction: column; align-items: center; }
    .balancin-equals { font-size: 40px; font-weight: bold; background-color: white; padding: 0 10px;}
    .balancin-entry { width: 80px; }

    .calc-result-box {
      background-color: black; color: white; font-family: "Arial", sans-serif; font-size: 20px; font-weight: bold;
      padding: 10px; width: 250px; text-align: right; border-radius: 3px; margin-top: 10px; min-height: 30px;
    }
  </style>
</head>
